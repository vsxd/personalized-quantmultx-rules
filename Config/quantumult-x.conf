# vsxd Quantumult X — 自有规则路由基线，2026-10-14
# 使用说明和更新流程见 README.md / AGENTS.md。
# 不含订阅凭证、CA 私钥；无重写、解锁脚本或 HTTPS 解密。
# QX 保存的策略选择、分流匹配优化和 HTTP 抓取开关独立于本文件；导入后按验收文档核对。

[general]
server_check_url = http://www.gstatic.com/generate_204
server_check_timeout = 5000
# 仅节点格式转换需要此解析器；不是路由规则来源。固定版本，不执行上游 master 的漂移代码。
resource_parser_url = https://cdn.jsdelivr.net/gh/KOP-XIAO/QuantumultX@29ef7480402d145396c84082a6f9316fe12931d4/Scripts/resource-parser.js
# 仅关闭指定域名的 Fake-IP 映射；不是直连列表，也不是防 DNS 污染开关。
dns_exclusion_list = *.lan, *.local, localhost, localhost.*, *.msftconnecttest.com, *.msftncsi.com, *.srv.nintendo.net, *.stun.playstation.net, xbox.*.microsoft.com, *.xboxlive.com, stun.*, *.logon.battlenet.com.cn, *.logon.battle.net, *.blzstatic.cn, *.cmpassport.com, id6.me, open.e.189.cn, mdn.open.wo.cn, auth.wosms.cn, *.jegotrip.com.cn, *.icitymobile.mobi, *.pingan.com.cn, *.cmbchina.com, pool.ntp.org, *.pool.ntp.org, time.*.apple.com, PDC._msDCS.*.*, DC._msDCS.*.*, GC._msDCS.*.*, *.ipaas.cn, *.dbaas.private
# 只绕过原配置的私网/CGNAT/SSDP；不会绕过普通公网。修改后按 QX 提示重新连接或重启。
excluded_routes = 192.168.0.0/16, 172.16.0.0/12, 100.64.0.0/10, 10.0.0.0/8, 239.255.255.250/32
fallback_udp_policy = reject

[dns]
# 保留系统 DNS 以兼容工作网络 split-DNS；只保留两组通用解析，避免原来的五组重复竞争。
# 这仍是明文 DNS；如确认无企业私有域名需求，改用下面的单组 DoH（会覆盖通用/system DNS）。
server = 223.5.5.5
server = 119.29.29.29
# doh-server = https://223.5.5.5/dns-query, https://doh.pub/dns-query
# 企业域名按需用 server = /*.example.internal/system；勿凭猜测设置。
# 未禁用 IPv6；IPv6 分流必须随 IPv4 一起验收。

[policy]
# 默认代理出口使用手选节点，避免 AI 长会话因自动测速而换 IP；QX 可能保留上次手选状态。
static = OutSide, proxy, United States, Singapore, Japan, Hong Kong, LatencyAuto, img-url=https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Rocket.png
# 保留用户直连选择；直接在服务组手选地区，不经过额外 AI 中间组。
# 两个服务的地区选择独立；同一地区组的节点选择仍共享。
static = OpenAI, direct, United States, Singapore, Japan, proxy, img-url=https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/ChatGPT.png
static = Claude, direct, United States, Singapore, Japan, proxy, img-url=https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Lambda.png
# 共享 OpenAI 依赖直接使用 OpenAI 策略，避免与核心请求选成不同出口。
static = Apple, direct, OutSide, img-url=https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Apple.png
static = Microsoft, direct, OutSide, img-url=https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Microsoft.png
static = Google, OutSide, direct, img-url=https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Google_Search.png
static = Game, direct, OutSide, img-url=https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Game.png
static = Global, OutSide, direct, img-url=https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Global.png
static = China, direct, img-url=https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/China.png
static = Final, OutSide, direct, img-url=https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Final.png
# 地区组同时识别中文、英文和旗帜；排除订阅中的额度/到期占位节点。
static = United States, server-tag-regex=(?i)^(?!.*(?:剩余|到期|流量|套餐|过滤|网址|官网|traffic|expire|reset)).*(?:美国|美國|🇺🇸|united states|\bUS\b|洛杉矶|洛杉磯|硅谷|矽谷), img-url=https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/United_States.png
static = Singapore, server-tag-regex=(?i)^(?!.*(?:剩余|到期|流量|套餐|过滤|网址|官网|traffic|expire|reset)).*(?:新加坡|狮城|獅城|🇸🇬|singapore|\bSG\b), img-url=https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Singapore.png
static = Japan, server-tag-regex=(?i)^(?!.*(?:剩余|到期|流量|套餐|过滤|网址|官网|traffic|expire|reset)).*(?:日本|东京|東京|大阪|🇯🇵|japan|\bJP\b), img-url=https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Japan.png
static = Hong Kong, server-tag-regex=(?i)^(?!.*(?:剩余|到期|流量|套餐|过滤|网址|官网|traffic|expire|reset)).*(?:香港|🇭🇰|hong kong|\bHK\b), img-url=https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Hong_Kong.png
# 仅手动选择时才进入自动测速组；tolerance 降低微小抖动导致的切换。
url-latency-benchmark = LatencyAuto, server-tag-regex=(?i)^(?!.*(?:剩余|到期|流量|套餐|过滤|网址|官网|traffic|expire|reset)).*(?:香港|新加坡|狮城|日本|美国|hong kong|singapore|japan|united states|🇭🇰|🇸🇬|🇯🇵|🇺🇸), check-interval=900, tolerance=150, alive-checking=false, img-url=https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Magic.png

