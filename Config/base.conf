# vsxd Quantumult X — 自有规则路由基线，2026-10-14
# 使用说明和更新流程见 README.md / AGENTS.md。
# 不含订阅凭证、CA 私钥；无重写、解锁脚本或 HTTPS 解密。
# QX 保存的策略选择、分流匹配优化和 HTTP 抓取开关独立于本文件；导入后按验收文档核对。

[general]
server_check_url = http://www.gstatic.com/generate_204
server_check_timeout = 5000
# 仅节点格式转换需要此解析器；不是路由规则来源。固定版本，不执行上游 master 的漂移代码。
resource_parser_url = https://cdn.jsdelivr.net/gh/KOP-XIAO/QuantumultX@29ef7480402d145396c84082a6f9316fe12931d4/Scripts/resource-parser.js
# 仅关闭指定域名的 Fake-IP 映射；不是直连列表，也不是防 DNS 污染开关。
dns_exclusion_list = *.lan, *.local, localhost, localhost.*, *.msftconnecttest.com, *.msftncsi.com, *.srv.nintendo.net, *.stun.playstation.net, xbox.*.microsoft.com, *.xboxlive.com, stun.*, *.logon.battlenet.com.cn, *.logon.battle.net, *.blzstatic.cn, *.cmpassport.com, id6.me, open.e.189.cn, mdn.open.wo.cn, auth.wosms.cn, *.jegotrip.com.cn, *.icitymobile.mobi, *.pingan.com.cn, *.cmbchina.com, pool.ntp.org, *.pool.ntp.org, time.*.apple.com, PDC._msDCS.*.*, DC._msDCS.*.*, GC._msDCS.*.*, *.ipaas.cn, *.dbaas.private
# 只绕过原配置的私网/CGNAT/SSDP；不会绕过普通公网。修改后按 QX 提示重新连接或重启。
excluded_routes = 192.168.0.0/16, 172.16.0.0/12, 100.64.0.0/10, 10.0.0.0/8, 239.255.255.250/32
fallback_udp_policy = reject

[dns]
# 保留系统 DNS 以兼容工作网络 split-DNS；只保留两组通用解析，避免原来的五组重复竞争。
# 这仍是明文 DNS；如确认无企业私有域名需求，改用下面的单组 DoH（会覆盖通用/system DNS）。
server = 223.5.5.5
server = 119.29.29.29
# doh-server = https://223.5.5.5/dns-query, https://doh.pub/dns-query
# 企业域名按需用 server = /*.example.internal/system；勿凭猜测设置。
# 未禁用 IPv6；IPv6 分流必须随 IPv4 一起验收。

[policy]
# 默认代理出口使用手选节点，避免 AI 长会话因自动测速而换 IP；QX 可能保留上次手选状态。
static = OutSide, proxy, United States, Singapore, Japan, Hong Kong, LatencyAuto
static = AI-Proxy, United States, Singapore, Japan, proxy
# 保留用户直连选择；大陆普通网络直连 OpenAI/Claude 不保证可达，可显式选择 AI-Proxy。
static = OpenAI, direct, AI-Proxy
static = Claude, direct, AI-Proxy
# 共享供应商影响其他应用访问同域名；单独控制，默认跟随 OpenAI。
static = AI-Dependencies, OpenAI, direct, AI-Proxy
static = Apple, direct, OutSide
static = Microsoft, direct, OutSide
static = Google, OutSide, direct
static = Game, direct, OutSide
static = Global, OutSide, direct
static = China, direct
static = Final, OutSide, direct
# 地区组同时识别中文、英文和旗帜；排除订阅中的额度/到期占位节点。
static = United States, server-tag-regex=(?i)^(?!.*(?:剩余|到期|流量|套餐|过滤|网址|官网|traffic|expire|reset)).*(?:美国|美國|🇺🇸|united states|\bUS\b|洛杉矶|洛杉磯|硅谷|矽谷)
static = Singapore, server-tag-regex=(?i)^(?!.*(?:剩余|到期|流量|套餐|过滤|网址|官网|traffic|expire|reset)).*(?:新加坡|狮城|獅城|🇸🇬|singapore|\bSG\b)
static = Japan, server-tag-regex=(?i)^(?!.*(?:剩余|到期|流量|套餐|过滤|网址|官网|traffic|expire|reset)).*(?:日本|东京|東京|大阪|🇯🇵|japan|\bJP\b)
static = Hong Kong, server-tag-regex=(?i)^(?!.*(?:剩余|到期|流量|套餐|过滤|网址|官网|traffic|expire|reset)).*(?:香港|🇭🇰|hong kong|\bHK\b)
# 仅手动选择时才进入自动测速组；tolerance 降低微小抖动导致的切换。
url-latency-benchmark = LatencyAuto, server-tag-regex=(?i)^(?!.*(?:剩余|到期|流量|套餐|过滤|网址|官网|traffic|expire|reset)).*(?:香港|新加坡|狮城|日本|美国|hong kong|singapore|japan|united states|🇭🇰|🇸🇬|🇯🇵|🇺🇸), check-interval=900, tolerance=150, alive-checking=false

[server_remote]
# 在 QX 内添加自己的订阅；或用 scripts/build_config.py --private-from 本地私有配置生成。

[server_local]

[filter_remote]
# 由构建器插入自有仓库的完整规则文件；不引用其他规则仓库。

[filter_local]
# 本机和私网；公网服务分类在自有 Rules/ 中。
ip-cidr, 10.0.0.0/8, direct
ip-cidr, 127.0.0.0/8, direct
ip-cidr, 172.16.0.0/12, direct
ip-cidr, 192.168.0.0/16, direct
ip-cidr, 100.64.0.0/10, direct
ip-cidr, 169.254.0.0/16, direct
ip-cidr, 224.0.0.0/24, direct
ip6-cidr, ::1/128, direct
ip6-cidr, fc00::/7, direct
ip6-cidr, fe80::/10, direct
geoip, cn, direct
final, Final

[rewrite_remote]
# 稳定路由基线不加载重写；如确需去广告，独立评估后逐一启用，见 docs/rewrite-audit.md。

[rewrite_local]

[task_local]
# 不默认加载会自行发起请求的测速/解锁查询脚本。

[http_backend]

[mitm]
# 不含 CA；同时在 QX UI 关闭 HTTP 抓取和 MitM，避免全局“额外主机名 *”覆盖本地设置。
hostname = -hsbc.com.hk, -*.hsbc.com.hk, -hsbc.com, -*.hsbc.com, -hsbc.edge.sdk.awswaf.com, -openai.com, -*.openai.com, -chatgpt.com, -*.chatgpt.com, -oaistatic.com, -*.oaistatic.com, -oaiusercontent.com, -*.oaiusercontent.com
