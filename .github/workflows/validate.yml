name: Validate Quantumult X rules

on:
  push:
  pull_request:

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/validate_rules.py
      - run: python3 scripts/audit_semantics.py
      - run: python3 scripts/build_config.py --output Config/quantumult-x.conf
      - run: git diff --exit-code -- Config/quantumult-x.conf
